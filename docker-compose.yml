services:
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file: .env
    environment:
      # .env's DATABASE_URL is an absolute host path (used by the host-run
      # scheduler too); the bind mount below puts that same file at this
      # container path so both sides read/write the identical sqlite file.
      DATABASE_URL: sqlite:////app/data/jobs.db
    ports:
      - "8501:8501"
    volumes:
      - ${SQLITE_DATA_DIR}:/app/data
