name: Automatic Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Both tests default DATABASE_URL to an in-memory sqlite db via their
      # own os.environ.setdefault() — no external service needed anymore.
      - name: Run test suite
        run: |
          python -m test.test_clear_chat
          python -m test.test_seed_mode
