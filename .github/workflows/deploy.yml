name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # DATABASE_URL is intentionally not set here: test_seed_mode.py's own
      # os.environ.setdefault() default already points at postgres:test@localhost:5434/test,
      # matching the service above. test_clear_chat.py defaults to an in-memory
      # sqlite db and doesn't touch postgres at all.
      - name: Run test suite
        run: |
          python -m test.test_clear_chat
          python -m test.test_seed_mode

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/job_scraper/vyserion_job_scraper
            git pull
            bash deploy/deploy.sh
